<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OSM Extract - Clip area editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/geoman.css">
<style>
  html, body { margin:0; padding:0; height:100%; }
  #map  { position:absolute; width:100%; height:100%; background:#eef2f5; }
  #panel {
    position:absolute; top:10px; left:10px; z-index:1000;
    font:13px/1.45 sans-serif; color:#22303c;
    background:rgba(255,255,255,0.95); border:1px solid #cfd8de;
    border-radius:6px; padding:10px 14px; max-width:340px;
    box-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  #panel h1 { font-size:14px; margin:2px 0 6px; }
  #legend   { margin-bottom:6px; }
  .swatch   { display:inline-block; width:16px; height:3px; margin:0 4px 2px 0; vertical-align:middle; }
  .coast    { background:#2f7fa8; }
  .admin    { background:#8f2f22; }
  .county   { background:#d0876c; }
  .clip     { background:#1a7ad4; }
  #save     { width:100%; padding:6px; cursor:pointer; font-style:bold; }
  #status   { margin-top:6px; font-size:12px; color:#4a5b68; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Clip area editor</h1>
  <div id="legend">
    <span class="swatch coast"></span>coastline &nbsp;
    <span class="swatch admin"></span>country/region &nbsp;
    <span class="swatch county"></span>province &nbsp;
    <span class="swatch clip"></span>clip area
  </div>
  Draw the polygon around the area to extract from the PBF
  (toolbar at the top-right), adjust it with the edit/drag tools, then save it.
  <button id="save">Save clip area</button>
  <div id="status"></div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="vendor/geoman.js"></script>
<script src="app.js"></script>
</body>
</html>
